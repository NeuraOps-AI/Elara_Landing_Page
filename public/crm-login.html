<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · ELARA CRM</title>
  <link rel="stylesheet" href="/crm-login.css?v=1">
  <script src="/crm-login.js?v=1" defer></script>
</head>
<body>
  <main class="login-shell">
    <a class="login-brand" href="/" aria-label="ELARA website"><img src="/assets/elara-logo-copper.png" width="145" height="120" alt="ELARA — Sculpted Sunlit Villas"></a>
    <section class="login-card" aria-labelledby="login-title">
      <span class="lock-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span>
      <p class="eyebrow">THE SALES WORKSPACE</p>
      <h1 id="login-title">Welcome back.</h1>
      <p class="login-description">Enter your password to open the ELARA CRM.</p>
      <form id="crm-login-form" action="/api/crm/login" method="post">
        <label for="crm-password">Password</label>
        <div class="password-field">
          <input id="crm-password" name="password" type="password" autocomplete="current-password" maxlength="256" required aria-describedby="login-error" spellcheck="false" autocapitalize="off">
          <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" aria-controls="crm-password" aria-pressed="false">Show</button>
        </div>
        <p class="login-error" id="login-error" role="alert" hidden></p>
        <button class="login-submit" id="login-submit" type="submit"><span>Sign in</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
      </form>
      <noscript><p class="login-error">Enable JavaScript to sign in to your workspace.</p></noscript>
      <p class="login-note">For the ELARA team.</p>
    </section>
    <a class="website-return" href="/">← Return to the website</a>
    <p class="login-footer">ELARA <span>/</span> Sculpted Sunlit Villas</p>
  </main>
</body>
</html>
