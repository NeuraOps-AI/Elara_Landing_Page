[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["public/index.html", "public/crm.html", "public/crm-login.html", "private/*.pdf", "!public/assets/**", "!public/fonts/**", "!public/vendor/**", "!public/*.js", "!public/*.css", "!data/**", "!.env*", "!output/**", "!tmp/**", "!.netlify/elara-dev/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
